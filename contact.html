<!DOCTYPE html>
<html>
<head>
<title>Contact | Clinton Yade</title>
</head>

<body style="margin:0;font-family:Arial,Helvetica,sans-serif;background-color:#f4f6f9;">

<!-- Navigation Bar -->
<div style="background:#0a192f;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;">
    <h2 style="margin:0;">Clinton Yade</h2>
    <div>
        <a href="index.html" style="color:white;text-decoration:none;margin:15px;">Home</a>
        <a href="contact.html" style="color:white;text-decoration:none;margin:15px;">Contact</a>
    </div>
</div>

<!-- Contact Section -->
<div style="padding:80px;text-align:center;">
    <h1>Contact Me</h1>
    <p style="font-size:18px;color:#555;">Want to collaborate? Send me a message!</p>

    <form style="max-width:500px;margin:auto;background:white;padding:30px;border-radius:10px;box-shadow:0 5px 10px rgba(0,0,0,0.1);text-align:left;">
        <label>Name:</label><br>
        <input type="text" placeholder="Your Name" style="width:100%;padding:10px;margin:10px 0;border-radius:5px;border:1px solid #ccc;"><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Your Email" style="width:100%;padding:10px;margin:10px 0;border-radius:5px;border:1px solid #ccc;"><br>

        <label>Message:</label><br>
        <textarea placeholder="Your Message" style="width:100%;padding:10px;margin:10px 0;border-radius:5px;border:1px solid #ccc;" rows="5"></textarea><br>

        <button type="submit" style="padding:12px 25px;border:none;background:#0a192f;color:white;font-size:16px;border-radius:5px;cursor:pointer;">
            Send Message
        </button>
    </form>
</div>

<!-- Footer -->
<div style="background:#020c1b;color:white;text-align:center;padding:15px;">
    <p>© 2026 Clinton Yade | All Rights Reserved</p>
</div>

</body>
</html>
